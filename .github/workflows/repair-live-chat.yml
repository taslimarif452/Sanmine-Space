name: Repair live chat
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed stream handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/page.tsx')
          s=p.read_text()
          bad='''if(d.type==="delta"&&d.delta){
          streamed+=d.delta;
          setStatus("Writing answer");
          if(!typeTimer){
            typeTimer=setInterval(()=>{
              if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
              displayed=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
              setMsgs([...base,{role:"assistant",content:displayed}]);
            },30);
          }
        }]);}
        if(d.type==="done"'''
          good='''if(d.type==="delta"&&d.delta){
          streamed+=d.delta;
          setStatus("Writing answer");
          if(!typeTimer){
            typeTimer=setInterval(()=>{
              if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
              displayed=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
              setMsgs([...base,{role:"assistant",content:displayed}]);
            },30);
          }
        }
        if(d.type==="done"'''
          if bad not in s:
              raise SystemExit('exact malformed stream handler not found')
          s=s.replace(bad,good,1)

          # Show live activity immediately and as separate text items, not a status card.
          old='''{loading&&status&&<div className="flex items-center gap-2 px-1 text-sm text-[var(--muted)]"><span className="inline-flex items-center gap-2"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/><span>{label(status)}</span><span className="inline-flex gap-0.5" aria-hidden="true"><i className="h-1 w-1 animate-bounce rounded-full bg-current [animation-delay:-.2s]"/><i className="h-1 w-1 animate-bounce rounded-full bg-current [animation-delay:-.1s]"/><i className="h-1 w-1 animate-bounce rounded-full bg-current"/></span></span></div>}'''
          new='''{loading&&status&&<><span className="mb-3 inline-flex items-center gap-2 px-1 text-sm text-[var(--muted)]"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/><span>{label(status)}</span><Loader2 size={14} className="animate-spin"/></span>{steps.slice(-5).map((step,i)=><span key={`${step}-${i}`} className="mb-3 ml-3 inline-flex items-center gap-1.5 text-sm text-[var(--muted)]"><Check size={13}/>{step}</span>)}</>}'''
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix: restore live chat activity and typewriter streaming"
          git push
          git rm .github/workflows/repair-live-chat.yml
          git commit -m "chore: remove temporary live chat repair workflow"
          git push
