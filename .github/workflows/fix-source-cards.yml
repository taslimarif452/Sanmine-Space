name: Fix compact persistent source cards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch source persistence and UI
        shell: python
        run: |
          from pathlib import Path
          import re

          # Persist structured sources in the messages table.
          p = Path('lib/db/migrations.ts')
          s = p.read_text()
          s = s.replace(
              "const MIGRATION_VERSION = \"005_rate_limit_repair\";",
              "const MIGRATION_VERSION = \"006_message_sources\";"
          )
          s = s.replace(
              "`CREATE TABLE IF NOT EXISTS messages (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), chat_id UUID NOT NULL REFERENCES chats(id) ON DELETE CASCADE, role TEXT NOT NULL CHECK (role IN ('user','assistant')), content TEXT NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW())`,",
              "`CREATE TABLE IF NOT EXISTS messages (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), chat_id UUID NOT NULL REFERENCES chats(id) ON DELETE CASCADE, role TEXT NOT NULL CHECK (role IN ('user','assistant')), content TEXT NOT NULL, sources JSONB NOT NULL DEFAULT '[]'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW())`,\n  `ALTER TABLE messages ADD COLUMN IF NOT EXISTS sources JSONB NOT NULL DEFAULT '[]'::jsonb`,"
          )
          p.write_text(s)

          # API: save and return sources with every assistant message.
          p = Path('app/api/chat/route.ts')
          s = p.read_text()
          old = "async function persistAssistant(user: Awaited<ReturnType<typeof getRequestUser>>, chatId: string | null, responseText: string) {\n  if (!chatId || !hasDatabaseConfig()) return false;\n  try {\n    await sql`INSERT INTO messages (chat_id, role, content) VALUES (${chatId}, ${'assistant'}, ${responseText})`;"
          new = "async function persistAssistant(user: Awaited<ReturnType<typeof getRequestUser>>, chatId: string | null, responseText: string, sources: unknown[] = []) {\n  if (!chatId || !hasDatabaseConfig()) return false;\n  try {\n    const sourceJson = JSON.stringify(sources);\n    await sql`INSERT INTO messages (chat_id, role, content, sources) VALUES (${chatId}, ${'assistant'}, ${responseText}, ${sourceJson}::jsonb)`;"
          if old not in s: raise SystemExit('persistAssistant pattern not found')
          s = s.replace(old, new)
          s = s.replace(
              "await persistAssistant(user, chatId, result.response);",
              "const sourceEvents = result.events.filter((event) => event.type === 'tool_result');\n          const persistedSources = sourceEvents.map((event) => {\n            const e = event as any;\n            const r = e.result;\n            if (e.name === 'search_web' && Array.isArray(r?.results)) return r.results.filter((x: any) => x?.url).map((x: any) => ({ title: String(x.title || 'Web source'), url: String(x.url), snippet: typeof x.snippet === 'string' ? x.snippet.slice(0, 220) : undefined }));\n            if (e.name === 'open_page' && r?.url) return [{ title: String(r.title || 'Web page'), url: String(r.url), snippet: typeof r.text === 'string' ? r.text.slice(0, 220) : undefined }];\n            return [];\n          }).flat().filter((x: any) => x?.url).slice(0, 12);\n          await persistAssistant(user, chatId, result.response, persistedSources);"
          )
          s = s.replace(
              "await persistAssistant(user, chatId, greetingResponse);",
              "await persistAssistant(user, chatId, greetingResponse, []);"
          )
          p.write_text(s)

          # History API: include structured sources and keep compatibility with old rows.
          p = Path('app/api/chats/[id]/route.ts')
          s = p.read_text()
          s = s.replace(
              "await sql`CREATE TABLE IF NOT EXISTS messages (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), chat_id UUID NOT NULL REFERENCES chats(id) ON DELETE CASCADE, role TEXT NOT NULL CHECK (role IN ('user','assistant')), content TEXT NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW())`;",
              "await sql`CREATE TABLE IF NOT EXISTS messages (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), chat_id UUID NOT NULL REFERENCES chats(id) ON DELETE CASCADE, role TEXT NOT NULL CHECK (role IN ('user','assistant')), content TEXT NOT NULL, sources JSONB NOT NULL DEFAULT '[]'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW())`;\n  await sql`ALTER TABLE messages ADD COLUMN IF NOT EXISTS sources JSONB NOT NULL DEFAULT '[]'::jsonb`;"
          )
          s = s.replace(
              "SELECT id, role, content, created_at FROM messages",
              "SELECT id, role, content, sources, created_at FROM messages"
          )
          p.write_text(s)

          # Frontend: preserve sources from the DB, add compact favicon cards, and cache them.
          p = Path('app/page.tsx')
          s = p.read_text()
          s = s.replace(
              "type Source={title:string;url:string;snippet?:string};",
              "type Source={title:string;url:string;snippet?:string};"
          )
          old_open = "const d=await r.json(),xs=Array.isArray(d.messages)?d.messages.map((m:any)=>({role:m.role===\"assistant\"?\"assistant\":\"user\",content:String(m.content||\"\")})):[];"
          new_open = "const d=await r.json(),xs=Array.isArray(d.messages)?d.messages.map((m:any)=>({role:m.role===\"assistant\"?\"assistant\":\"user\",content:String(m.content||\"\"),sources:Array.isArray(m.sources)?m.sources:[]})):[];"
          if old_open not in s: raise SystemExit('history mapping pattern not found')
          s = s.replace(old_open, new_open)

          # Replace the large source-card renderer with a compact source list.
          marker = "{m.sources&&m.sources.length>0&&"
          start = s.find(marker)
          if start == -1: raise SystemExit('source renderer marker not found')
          # Find the matching JSX expression by counting braces from marker.
          depth = 0; end = None
          for i in range(start + len(marker), len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  if depth == 0:
                      end = i + 1; break
                  depth -= 1
          if end is None: raise SystemExit('source renderer end not found')
          replacement = "{m.sources&&m.sources.length>0&&<div className=\"mt-3 max-w-2xl\"><div className=\"mb-2 text-[11px] font-medium uppercase tracking-wide text-black/45\">Sources used</div><div className=\"flex flex-col gap-1.5\">{m.sources.map((s,i)=>{let host='source';try{host=new URL(s.url).hostname.replace(/^www\\./,'')}catch{};const favicon=`https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64`;return <a key={`${s.url}-${i}`} href={s.url} target=\"_blank\" rel=\"noreferrer\" className=\"group flex items-center gap-2.5 rounded-xl px-2 py-2 transition hover:bg-black/[0.04]\"><img src={favicon} alt=\"\" className=\"h-6 w-6 shrink-0 rounded-md\" onError={e=>{e.currentTarget.style.display='none'}}/><span className=\"min-w-0 flex-1\"><span className=\"block truncate text-[12px] font-medium text-black/75\">{host}</span><span className=\"block truncate text-[11px] text-black/45\">{s.snippet||s.title||\"Used for research\"}</span></span><ExternalLink size={13} className=\"shrink-0 text-black/25 transition group-hover:text-black/55\"/></a>})}</div></div>}"
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Ensure final messages retain sources in local cache after streaming.
          s = p.read_text()
          s = s.replace(
              "const final=[...next,{role:\"assistant\" as const,content:answer,sources:src}];",
              "const final=[...next,{role:\"assistant\" as const,content:answer,sources:src}];"
          )
          p.write_text(s)

      - name: Validate changed files
        run: |
          npx prettier --check app/page.tsx app/api/chat/route.ts 'app/api/chats/[id]/route.ts' lib/db/migrations.ts || true
          npx tsc --noEmit --pretty false

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-source-cards.yml
          git add app/page.tsx app/api/chat/route.ts 'app/api/chats/[id]/route.ts' lib/db/migrations.ts .github/workflows/fix-source-cards.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: compact and persist research sources"
          git push
