name: Sanmine Space Background Research Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process-background-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process one queued background research job
        env:
          SANMINE_BASE_URL: https://sanmine-space.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${SANMINE_BASE_URL}/api/agent/background/worker"
