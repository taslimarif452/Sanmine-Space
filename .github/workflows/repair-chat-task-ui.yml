name: Improve Chat Task Progress UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-task-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Patch task progress UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/page.tsx")
          text = path.read_text()

          old = re.search(r'function Progress\(\{status,steps\}:\{status:string;steps:string\[\]\}\)\{.*?\}\nfunction Composer', text, re.S)
          if not old:
              raise SystemExit("Progress function not found; refusing to modify the file")

          new = '''function Progress({status,steps}:{status:string;steps:string[]}){
            const visible=steps.length?steps:[status||"Thinking"];
            if(!visible.length)return null;
            const iconFor=(label:string,active:boolean)=>{
              const value=label.toLowerCase();
              if(active)return <Loader2 size={15} className="shrink-0 animate-spin text-[#77736b]"/>;
              if(value.includes("search"))return <span className="grid h-[15px] w-[15px] shrink-0 place-items-center rounded-full border border-[#aaa69d] text-[9px]">⌕</span>;
              if(value.includes("open")||value.includes("source")||value.includes("website"))return <span className="grid h-[15px] w-[15px] shrink-0 place-items-center rounded-full border border-[#aaa69d] text-[9px]">↗</span>;
              if(value.includes("youtube"))return <span className="grid h-[15px] w-[15px] shrink-0 place-items-center rounded-full border border-[#aaa69d] text-[8px]">▶</span>;
              if(value.includes("writing")||value.includes("email")||value.includes("proposal"))return <span className="grid h-[15px] w-[15px] shrink-0 place-items-center rounded-full border border-[#aaa69d] text-[9px]">✦</span>;
              return <Check size={15} className="shrink-0 text-[#8b877f]"/>;
            };
            return <div className="mb-5 space-y-3" aria-live="polite" aria-label="Agent activity">
              {visible.map((step,i)=>{
                const active=i===visible.length-1 && !!status;
                return <div key={`${step}-${i}`} className={`flex items-center gap-2.5 text-[14px] leading-5 ${active?"text-[#77736b]":"text-[#9a968e]"}`}>
                  {iconFor(step,active)}
                  <span>{step}</span>
                </div>;
              })}
            </div>;
          }
          function Composer'''

          text = text[:old.start()] + new + text[old.end()-len("function Composer"):]
          text = text.replace('setSteps(s=>[...s,label].slice(-6));', 'setSteps(s=>[...s,label]);')
          path.write_text(text)
          PY

      - name: Typecheck and build
        run: npm run build

      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve ChatGPT-style live task progress UI"
          git rm .github/workflows/repair-chat-task-ui.yml
          git commit -m "Remove temporary chat UI repair workflow"
          git push
