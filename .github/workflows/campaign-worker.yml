name: Sanmine Space Outreach Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process-outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Process due campaign emails and sync Gmail events
        env:
          SANMINE_BASE_URL: https://sanmine-space.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" -H "Accept: application/json" \
            "${SANMINE_BASE_URL}/api/cron/campaigns"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" -H "Accept: application/json" \
            "${SANMINE_BASE_URL}/api/cron/email-events"
