name: Sanmine Space Campaign Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process-campaigns:
    runs-on: ubuntu-latest
    steps:
      - name: Process due campaign emails
        env:
          SANMINE_CRON_URL: https://sanmine-space.vercel.app/api/cron/campaigns
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${SANMINE_CRON_URL}"
