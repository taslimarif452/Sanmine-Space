name: Phase 6 UI labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove progress container styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'function Progress({status,steps}:{status:string;steps:string[]}){if(!status&&!steps.length)return null;return <div className="mb-3 flex flex-wrap items-center gap-2 text-[13px] text-[#77736b]"><span className="inline-flex items-center gap-2 rounded-full border border-[#e5e1d8] bg-[#faf9f6] px-3 py-1.5"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/>{status||"Thinking"}<Loader2 size={13} className="animate-spin"/></span>{steps.slice(-3,-1).map((s,i)=><span key={`${s}-${i}`} className="hidden items-center gap-1.5 sm:inline-flex"><Check size={12}/> {s}</span>)}</div>}'
          new = 'function Progress({status,steps}:{status:string;steps:string[]}){if(!status&&!steps.length)return null;return <><span className="mb-3 inline-flex items-center gap-2 text-[13px] text-[#77736b]"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/>{status||"Thinking"}<Loader2 size={13} className="animate-spin"/></span>{steps.slice(-3,-1).map((s,i)=><span key={`${s}-${i}`} className="mb-3 hidden items-center gap-1.5 text-[13px] text-[#77736b] sm:inline-flex"><Check size={12}/> {s}</span>)}</>}'
          if old not in s:
              raise SystemExit('Expected Progress component was not found; refusing unrelated changes')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Simplify chat progress presentation'
          git push
