name: Phase 6 UI labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair chat progress and streaming
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          # Repair the exact malformed stream handler from the previous attempted patch.
          bad='''if(d.type==="delta"&&d.delta){
          streamed+=d.delta;
          setStatus("Writing answer");
          if(!typeTimer){
            typeTimer=setInterval(()=>{
              if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
              displayed=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
              setMsgs([...base,{role:"assistant",content:displayed}]);
            },30);
          }
        }]);}
        if(d.type==="done"'''
          good='''if(d.type==="delta"&&d.delta){
          streamed+=d.delta;
          setStatus("Writing answer");
          if(!typeTimer){
            typeTimer=setInterval(()=>{
              if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
              displayed=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
              setMsgs([...base,{role:"assistant",content:displayed}]);
            },30);
          }
        }
        if(d.type==="done"'''
          if bad in s:
              s=s.replace(bad,good,1)

          # Keep progress plain and visible: Thinking, then every real tool step as it happens.
          old='function Progress({status,steps}:{status:string;steps:string[]}){if(!status&&!steps.length)return null;return <div className="mb-3 flex flex-wrap items-center gap-2 text-[13px] text-[#77736b]"><span className="inline-flex items-center gap-2 rounded-full border border-[#e5e1d8] bg-[#faf9f6] px-3 py-1.5"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/>{status||"Thinking"}<Loader2 size={13} className="animate-spin"/></span>{steps.slice(-3,-1).map((s,i)=><span key={`${s}-${i}`} className="hidden items-center gap-1.5 sm:inline-flex"><Check size={12}/> {s}</span>)}</div>}'
          new='function Progress({status,steps}:{status:string;steps:string[]}){if(!status&&!steps.length)return null;return <><span className="mb-3 inline-flex items-center gap-2 text-[13px] text-[#77736b]"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/>{status||"Thinking"}<Loader2 size={13} className="animate-spin"/></span>{steps.slice(-5).map((s,i)=><span key={`${s}-${i}`} className="mb-3 ml-3 inline-flex items-center gap-1.5 text-[13px] text-[#77736b]"><Check size={12}/> {s}</span>)}</>}'
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'fix: restore live chat progress and streaming'
          git push
