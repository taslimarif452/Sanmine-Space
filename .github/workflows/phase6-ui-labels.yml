name: Phase 6 UI labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add proposal and email progress labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'function label(s:string){return ({thinking:"Thinking",searching:"Searching the web",opening:"Opening website",analyzing:"Analyzing",youtube:"Searching YouTube",researching:"Researching"} as Record<string,string>)[s]||"Thinking"} function tool(n?:string){if(n==="search_web")return"searching";if(n==="open_page")return"opening";if(n==="website_analyze")return"analyzing";if(n?.includes("youtube"))return"youtube";return"researching"}'
          new = 'function label(s:string){return ({thinking:"Thinking",searching:"Searching the web",opening:"Opening website",analyzing:"Analyzing",youtube:"Searching YouTube",proposal:"Generating proposal",email:"Writing email",researching:"Researching"} as Record<string,string>)[s]||"Thinking"} function tool(n?:string){if(n==="search_web")return"searching";if(n==="open_page")return"opening";if(n==="website_analyze")return"analyzing";if(n==="generate_proposal")return"proposal";if(n==="generate_outreach_email")return"email";if(n?.includes("youtube"))return"youtube";return"researching"}'
          if old not in s:
              raise SystemExit('Expected label/tool function was not found; refusing unrelated changes')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Show Phase 6 proposal and email generation status'
          git push
