name: Fix chat UX
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger chat UX repair')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix live agent activity and natural response streaming
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/page.tsx')
          s = p.read_text()

          # Keep the existing UI status labels, but don't hide completed activity on desktop.
          s = s.replace('steps.slice(-3,-1)', 'steps.slice(-5)')

          # Show activity immediately, before the first model token arrives, without a card/div.
          old = '{loading&&status&&<div className="flex items-center gap-3 px-1 text-sm text-[var(--muted)]"><span>{label(status)} <Loader2 size={14} className="inline animate-spin"/></span></div>}'
          if old in s:
              new = '{loading&&status&&<><span className="mb-3 inline-flex items-center gap-2 px-1 text-sm text-[var(--muted)]"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/><span>{label(status)}</span><Loader2 size={14} className="animate-spin"/></span>{steps.slice(-5).map((step,i)=><span key={`${step}-${i}`} className="mb-3 ml-3 inline-flex items-center gap-1.5 text-sm text-[var(--muted)]"><Check size={13}/>{step}</span>)}</>}'
              s = s.replace(old, new, 1)
          else:
              # If the previous compact progress patch changed the exact markup, replace its loading block too.
              pattern = r'\{loading&&status&&<div className="flex items-center gap-2 px-1 text-sm text-\[var\(--muted\)\]">.*?</div>\}'
              repl = '{loading&&status&&<><span className="mb-3 inline-flex items-center gap-2 px-1 text-sm text-[var(--muted)]"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/><span>{label(status)}</span><Loader2 size={14} className="animate-spin"/></span>{steps.slice(-5).map((step,i)=><span key={`${step}-${i}`} className="mb-3 ml-3 inline-flex items-center gap-1.5 text-sm text-[var(--muted)]"><Check size={13}/>{step}</span>)}</>}'
              s, n = re.subn(pattern, repl, s, count=1, flags=re.S)
              if n == 0:
                  raise SystemExit('Could not locate the chat progress JSX')

          # The current stream renders each provider delta immediately. Keep the network stream real,
          # but reveal the accumulated answer progressively so large responses don't appear all at once.
          old = 'let answer="",streamed="",events:Event[]=[],id=chatId;'
          new = 'let answer="",streamed="",displayed="",events:Event[]=[],id=chatId; let typeTimer:ReturnType<typeof setInterval>|null=null;'
          if old not in s:
              raise SystemExit('stream state marker not found')
          s = s.replace(old, new, 1)

          old = 'if(d.type==="delta"&&d.delta){streamed+=d.delta;setStatus("Writing answer");setMsgs([...base,{role:"assistant",content:streamed}]);}'
          new = '''if(d.type==="delta"&&d.delta){
            streamed+=d.delta;
            setStatus("Writing answer");
            if(!typeTimer){
              typeTimer=setInterval(()=>{
                if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
                const next=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
                displayed=next;
                setMsgs([...base,{role:"assistant",content:displayed}]);
              },30);
            }
          }'''
          if old not in s:
              raise SystemExit('delta streaming marker not found')
          s = s.replace(old, new, 1)

          # Flush the typewriter before the final persisted message, then clear its timer on completion/error.
          old = 'if(!answer)answer=streamed;if(!answer)throw new Error("The AI completed without a usable answer.");'
          new = '''if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
          displayed=streamed;
          if(!answer)answer=streamed;if(!answer)throw new Error("The AI completed without a usable answer.");'''
          if old not in s:
              raise SystemExit('stream completion marker not found')
          s = s.replace(old, new, 1)

          old = 'finally{abortRef.current=null;setLoading(false);setStatus("");setSteps([]);}'
          new = 'finally{if(typeTimer)clearInterval(typeTimer);abortRef.current=null;setLoading(false);setStatus("");setSteps([]);}'
          if old not in s:
              raise SystemExit('stream finally marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && { echo "No patch changes"; exit 1; }
          git commit -m "fix: restore live agent activity and natural streaming"
          git push
          git rm .github/workflows/fix-chat-ux.yml
          git commit -m "chore: remove temporary chat UX repair workflow"
          git push
