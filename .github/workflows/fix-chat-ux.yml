name: Fix chat UX
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger chat UX repair')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat startup and research orchestration
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'setLoading(true);setError("");setStatus("");requestAnimationFrame(()=>scrollLatest("smooth"));'
          new = 'setLoading(true);setError("");setStatus("thinking");requestAnimationFrame(()=>scrollLatest("smooth"));'
          if old not in s:
              raise SystemExit('page.tsx submit marker not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/api/chat/route.ts')
          s = p.read_text()
          old = '''    await runProductionMigrations();
    await enforceRateLimit(`chat:${user.uid}`, 30, 60_000);
    const parsed = ChatRequestSchema.safeParse(await request.json().catch(() => null));
    if (!parsed.success) throw new AppError("VALIDATION_ERROR", parsed.error.issues[0]?.message || "Invalid chat request.", 400);
    const { message, history, chatId: requestedChatId } = parsed.data;
    const chatHistory = history as ChatMessage[];

    const chatId = await prepareChat(user, message, requestedChatId);
    const encoder = new TextEncoder();
    const stream = new ReadableStream({
      async start(controller) {
        const send = (payload: Record<string, unknown>) => controller.enqueue(encoder.encode(`${JSON.stringify(payload)}\\n`));
        try {
          if (chatId) send({ type: "chat", chatId });
'''
          new = '''    const parsed = ChatRequestSchema.safeParse(await request.json().catch(() => null));
    if (!parsed.success) throw new AppError("VALIDATION_ERROR", parsed.error.issues[0]?.message || "Invalid chat request.", 400);
    const { message, history, chatId: requestedChatId } = parsed.data;
    const chatHistory = history as ChatMessage[];

    const encoder = new TextEncoder();
    const stream = new ReadableStream({
      async start(controller) {
        const send = (payload: Record<string, unknown>) => controller.enqueue(encoder.encode(`${JSON.stringify(payload)}\\n`));
        try {
          send({ type: "event", event: { type: "thinking", name: "request_start", toolCallId: `request-${Date.now()}` } });
          await runProductionMigrations();
          await enforceRateLimit(`chat:${user.uid}`, 30, 60_000);
          const chatId = await prepareChat(user, message, requestedChatId);
          if (chatId) send({ type: "chat", chatId });
'''
          if old not in s:
              raise SystemExit('route.ts startup marker not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('lib/agent/agent.ts')
          s = p.read_text()
          old = '''  for (let round = 0; round < MAX_TOOL_ROUNDS; round += 1) {
    emitThinking();
    // Tool orchestration uses the non-streaming provider call. Streaming function-call
    // responses can leave some providers waiting indefinitely before the first tool event.
    // Once all tools are complete, the final answer is streamed separately without tools.
    const response = await provider.chat(messages, tools);
'''
          new = '''  const orchestrationTools = researchMode ? tools.filter((candidate) => candidate.name !== "search_web") : tools;

  for (let round = 0; round < MAX_TOOL_ROUNDS; round += 1) {
    emitThinking();
    // Tool orchestration uses the non-streaming provider call. Streaming function-call
    // responses can leave some providers waiting indefinitely before the first tool event.
    // Once all tools are complete, the final answer is streamed separately without tools.
    const response = await provider.chat(messages, orchestrationTools);
'''
          if old not in s:
              raise SystemExit('agent.ts orchestration marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/api/chat/route.ts lib/agent/agent.ts
          git commit -m "fix: make chat progress and web research start immediately"
          git push
          git rm .github/workflows/fix-chat-ux.yml
          git commit -m "chore: remove temporary chat UX repair workflow"
          git push
