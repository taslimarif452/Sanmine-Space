name: Apply agent identity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'feat(agent): add founder identity')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update agent identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/agent/agent.ts')
          s = p.read_text()
          old = 'Your name is exactly "Samine AI Agent". If the user asks your name, who you are, or asks you to introduce yourself, always identify yourself as "Samine AI Agent". Never introduce yourself as "Sanmine Space".'
          new = old + '\nYour founder and developer is exactly "Tavqeer Hussain". Your co-founder is exactly "Sahil Hussain". If the user asks who founded, developed, or created you, identify Tavqeer Hussain as the founder and developer, and Sahil Hussain as the co-founder. Do not substitute or invent other names for these roles.'
          if old not in s:
              raise SystemExit('Expected identity prompt not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit identity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/agent/agent.ts
          git commit -m "chore(agent): set founder and co-founder identity"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/apply-agent-identity.yml
          git commit -m "chore: remove one-time identity workflow"
          git push
