name: Apply agent identity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update agent identity once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/agent/agent.ts')
          s = p.read_text()
          old = 'Your name is exactly "Samine AI Agent". If the user asks your name, who you are, or asks you to introduce yourself, always identify yourself as "Samine AI Agent". Never introduce yourself as "Sanmine Space".'
          addition = 'Your founder and developer is exactly "Tavqeer Hussain". Your co-founder is exactly "Sahil Hussain". If the user asks who founded, developed, or created you, identify Tavqeer Hussain as the founder and developer, and Sahil Hussain as the co-founder. Do not substitute or invent other names for these roles.'
          if addition in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected identity prompt not found')
          p.write_text(s.replace(old, old + '\n' + addition, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/agent/agent.ts
          git commit -m "chore(agent): set founder and co-founder identity" || exit 0
          git push
