name: Repair provider export
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore provider implementation from known-good parent
        run: |
          git checkout 3ee17c552ef6bb02b381fbe5c8edd9d13ceafba8 -- lib/ai/provider.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/provider.ts
          git commit -m "fix: restore getProvider export" || true
          git push origin main
      - name: Repair chat streaming regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          bad='''if(d.type==="delta"&&d.delta){
          streamed+=d.delta;
          setStatus("Writing answer");
          if(!typeTimer){
            typeTimer=setInterval(()=>{
              if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
              displayed=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
              setMsgs([...base,{role:"assistant",content:displayed}]);
            },30);
          }
        }]);}
        if(d.type==="done"'''
          good='''if(d.type==="delta"&&d.delta){
          streamed+=d.delta;
          setStatus("Writing answer");
          if(!typeTimer){
            typeTimer=setInterval(()=>{
              if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
              displayed=streamed.slice(0,Math.min(streamed.length,displayed.length+7));
              setMsgs([...base,{role:"assistant",content:displayed}]);
            },30);
          }
        }
        if(d.type==="done"'''
          if bad in s:
              s=s.replace(bad,good,1)
              p.write_text(s)
          PY
          if ! git diff --quiet -- app/page.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/page.tsx
            git commit -m "fix: restore live chat activity and typewriter streaming"
            git push origin main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
