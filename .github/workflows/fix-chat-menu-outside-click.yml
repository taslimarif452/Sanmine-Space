name: Fix chat menu outside click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add outside-click handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          marker = '/* chat-menu-outside-click */'
          if marker not in s:
              needle = 'useEffect(()=>()=>{if(longPressTimer.current!==null)window.clearTimeout(longPressTimer.current)},[]);'
              addition = needle + '\nuseEffect(()=>{if(!menu)return;const close=()=>setMenu(null);document.addEventListener("pointerdown",close);return()=>document.removeEventListener("pointerdown",close)},[menu]);'+marker
              if needle not in s:
                  raise SystemExit('Expected chat menu hook was not found')
              p.write_text(s.replace(needle, addition, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Fix chat menu closing on outside click'
          git push
