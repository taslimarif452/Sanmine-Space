name: Fix chat UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch chat menu behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'useEffect(()=>{if(!menu)return;const close=()=>setMenu(null);document.addEventListener("pointerdown",close,true);document.addEventListener("mousedown",close,true);document.addEventListener("touchstart",close,true);document.addEventListener("click",close,true);return()=>{document.removeEventListener("pointerdown",close,true);document.removeEventListener("mousedown",close,true);document.removeEventListener("touchstart",close,true);document.removeEventListener("click",close,true)}},[menu]);'
          new = 'useEffect(()=>{if(!menu)return;const close=(e:Event)=>{const t=e.target;if(t instanceof Element){const b=t.closest("button");const label=(b?.textContent||"").trim().toLowerCase();if(label==="delete"||label==="rename"||label.includes("delete chat")||label.includes("rename chat"))return}setMenu(null)};document.addEventListener("pointerdown",close,true);document.addEventListener("mousedown",close,true);document.addEventListener("touchstart",close,true);document.addEventListener("click",close,true);return()=>{document.removeEventListener("pointerdown",close,true);document.removeEventListener("mousedown",close,true);document.removeEventListener("touchstart",close,true);document.removeEventListener("click",close,true)}},[menu]);'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              print('Menu effect already patched or source differs; leaving page unchanged')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Fix chat rename and delete menu actions'
          git push
