name: Fix chat UI streaming
on:
  push:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - '.github/workflows/fix-chat-ui.yml'
  workflow_dispatch:

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[chat-ui-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.tsx')
          s = p.read_text()

          # 1) Render the user's message immediately and include it in the request history.
          pattern = re.compile(r'const submit\s*=\s*\(\)\s*=>\s*\{\s*const q\s*=\s*text\.trim\(\);\s*if\s*\(!q\|\|loading\|\|loadingChat\|\|!user\)return;\s*const base\s*=\s*editingIndex===null\s*\?\s*msgs\s*:\s*msgs\.slice\(0,editingIndex\);\s*setMsgs\(base\);\s*setText\(""\);\s*setEditingIndex\(null\);\s*void send\(q,base,active\)\s*;\s*\}', re.S)
          replacement = 'const submit=()=>{const q=text.trim();if(!q||loading||loadingChat||!user)return;const base=editingIndex===null?msgs:msgs.slice(0,editingIndex);const userMessage:Message={role:"user",content:q};const next=[...base,userMessage];setMsgs(next);setText("");setEditingIndex(null);void send(q,next,active)};'
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate submit handler')

          # 2) Keep the live status text, but make the answer visibly type instead of appearing at once.
          stream = re.compile(r'if\(d\.type==="delta"&&d\.delta\)\{.*?\n\}', re.S)
          m = stream.search(s)
          if not m:
              raise SystemExit('Could not locate streaming delta block')
          block = m.group(0)
          if 'displayed+7' not in block and 'displayed.length+7' not in block:
              raise SystemExit('Streaming block already has an unexpected shape')
          new_block = '''if(d.type==="delta"&&d.delta){
  streamed+=d.delta;
  setStatus("Writing answer");
  if(!typeTimer){
    typeTimer=setInterval(()=>{
      if(displayed.length>=streamed.length){clearInterval(typeTimer!);typeTimer=null;return;}
      displayed=streamed.slice(0,displayed.length+1);
      setMsgs([...base,{role:"assistant",content:displayed}]);
    },18);
  }
}'''
          s = s[:m.start()] + new_block + s[m.end():]

          # 3) Drain the typewriter queue before the final assistant message is committed.
          finish = re.compile(r'if\(typeTimer\)\{clearInterval\(typeTimer\);typeTimer=null;\}\s*displayed=streamed;')
          s, n = finish.subn('while(displayed.length<streamed.length){await new Promise(r=>setTimeout(r,18));}\n      if(typeTimer){clearInterval(typeTimer);typeTimer=null;} displayed=streamed;', s, count=1)
          if n != 1:
              raise SystemExit('Could not locate final streaming flush')

          # 4) Avoid showing the same live status twice when the progress component also receives steps.
          progress = re.compile(r'function Progress\(\{status,steps\}:\{status:string;steps:string\[\]\}\)\{.*?\}', re.S)
          pm = progress.search(s)
          if pm:
              s = s[:pm.start()] + 'function Progress({status,steps}:{status:string;steps:string[]}){if(!status&&!steps.length)return null;return <span className="mb-3 inline-flex items-center gap-2 text-[13px] text-[#77736b]"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-current"/>{status||steps.at(-1)||"Thinking"}<Loader2 size={13} className="animate-spin"/></span>}' + s[pm.end():]

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Fix visible user messages and natural chat typing [chat-ui-fix]'
          git push
