name: One-time agent routing fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-agent:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch agent routing
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/agent/agent.ts')
          text = path.read_text()
          old = 'if (isExplicitSendRequest(userMessage) && userId) {'
          new = 'if (isExplicitSendRequest(userMessage) && userId && parseResearchTargets(history).length) {'
          if old not in text:
              raise SystemExit('target line not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/agent/agent.ts
          git commit -m 'fix: allow research then outreach in one request'
          git rm .github/workflows/one-time-agent-routing-fix.yml
          git commit -m 'chore: remove one-time patch workflow'
          git push