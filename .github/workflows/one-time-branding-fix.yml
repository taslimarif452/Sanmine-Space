name: One-time branding UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch branding UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Keep the landing-page footer on the same warm surface as the
          # "AI does the work. You make the decision." section.
          p = Path("components/premium-landing.tsx")
          s = p.read_text()
          def patch_footer(m):
              attrs, classes = m.group(1), m.group(2)
              classes = re.sub(r'\bbg-\[[^\]]+\]', 'bg-[#f3f1ec]', classes)
              if 'bg-[#f3f1ec]' not in classes:
                  classes += ' bg-[#f3f1ec]'
              return f'<footer{attrs}className="{classes}"'
          s = re.sub(r'<footer([^>]*?)className="([^"]*)"', patch_footer, s, count=1)
          p.write_text(s)

          # Chat product naming: use the actual product name everywhere it is
          # rendered, while removing the duplicate product-name label from the
          # chat header so the sidebar remains the single visible brand.
          p = Path("app/page.tsx")
          s = p.read_text().replace("Samine AI Agent", "Sanmine Space")

          # Remove a simple header title element when it consists solely of
          # the product name. This intentionally leaves the header controls
          # intact.
          s = re.sub(
              r'<div([^>]*)>\s*(?:<[^>]*>)?\s*Sanmine Space\s*(?:</[^>]+>)?\s*</div>',
              lambda m: '' if 'header' in s[max(0, m.start()-800):m.start()].lower() else m.group(0),
              s,
              count=1,
          )
          p.write_text(s)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-branding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/premium-landing.tsx app/page.tsx .github/workflows/one-time-branding-fix.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: align footer and chat branding"
          git push
